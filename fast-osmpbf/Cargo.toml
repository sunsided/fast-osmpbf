[package]
name = "fast-osmpbf"
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
authors = ["d.steblin.dev@gmail.com"]
description = "Fast OSM PBF parser for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QuodEstDubitandum/fast-osmpbf"
keywords = ["openstreetmap", "osm", "pbf", "parser", "protobuf"]
categories = ["parsing", "api-bindings", "concurrency", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/fast-osmpbf"

[dependencies]
rayon = "1.11.0"
quick-protobuf = "0.8.0"
flate2 = { version = "1.1.5", features = ["zlib-rs"], default-features = false }
crossbeam-channel = "0.5"
xz2 = "0.1.7"
memmap2 = { version = "0.9", optional = true }

[build-dependencies]
pb-rs = "0.10.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parse"
harness = false

# Release-like profile with debug info for flamegraph profiling.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[features]
node_bindings = []
mmap = ["dep:memmap2"]
